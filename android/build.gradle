plugins { id 'com.android.library'; id 'com.vanniktech.maven.publish' }
android {
    namespace 'com.surcumference.fingerprintlocation'
    compileSdk { version = release(37) { minorApiLevel = 2 } }
    buildToolsVersion '37.0.0'
    defaultConfig { minSdk 23; consumerProguardFiles 'consumer-rules.pro' }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    testOptions {
        unitTests.includeAndroidResources = true
        unitTests.all { jvmArgs '--add-opens=java.base/jdk.internal.access=ALL-UNNAMED' }
    }
}
dependencies {
    api project(':core')
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.17'
}
apply from: rootProject.file('gradle/maven-publishing.gradle')
