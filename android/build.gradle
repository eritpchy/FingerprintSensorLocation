plugins { id 'com.android.library'; id 'maven-publish' }
android {
    namespace 'com.surcumference.fingerprintlocation'
    compileSdk { version = release(37) { minorApiLevel = 2 } }
    buildToolsVersion '37.0.0'
    defaultConfig { minSdk 23; consumerProguardFiles 'consumer-rules.pro' }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    publishing { singleVariant('release') { withSourcesJar() } }
    testOptions {
        unitTests.includeAndroidResources = true
        unitTests.all { jvmArgs '--add-opens=java.base/jdk.internal.access=ALL-UNNAMED' }
    }
}
dependencies {
    api project(':core')
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.17'
}
afterEvaluate {
    publishing { publications { library(MavenPublication) {
        artifactId = 'fingerprint-location-android'
        from components.release
    } } }
}
