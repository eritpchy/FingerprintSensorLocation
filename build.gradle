plugins { id 'com.android.library' version '9.4.1' apply false }
plugins { id 'com.android.application' version '9.4.1' apply false }
plugins { id 'com.vanniktech.maven.publish' version '0.37.0' apply false }
allprojects {
    group = 'net.xdow'
    version = providers.gradleProperty('libraryVersion').get()
    tasks.withType(Test).configureEach {
        if (providers.gradleProperty('testJavaExecutable').isPresent())
            executable = providers.gradleProperty('testJavaExecutable').get()
    }
}
