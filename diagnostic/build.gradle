plugins { id 'com.android.application' }
def cloudQrMode = providers.gradleProperty('diagnosticCloudQr').orElse('off').get()
if (!(cloudQrMode in ['off', 'runtime', 'specifications', 'sequence'])) {
    throw new GradleException('diagnosticCloudQr must be off, runtime, specifications or sequence')
}
android {
    namespace 'com.surcumference.fingerprintlocation.diagnostic'
    compileSdk { version = release(37) { minorApiLevel = 2 } }
    buildToolsVersion '37.0.0'
    defaultConfig {
        applicationId 'com.surcumference.fingerprintlocation.diagnostic' +
                (cloudQrMode == 'off' ? '' : '.cloud.' + cloudQrMode)
        manifestPlaceholders = [diagnosticAppLabel: cloudQrMode == 'off' ? '@string/app_name' :
                'Fingerprint Location Cloud ' + cloudQrMode.capitalize()]
        minSdk 23
        targetSdk 36
        versionCode 4
        versionName project.version
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        buildConfigField 'boolean', 'CLOUD_SEQUENCE', (cloudQrMode == 'sequence').toString()
        buildConfigField 'boolean', 'CLOUD_QR_AUTO', (cloudQrMode != 'off').toString()
        buildConfigField 'boolean', 'CLOUD_SPECIFICATIONS', (cloudQrMode == 'specifications').toString()
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    buildFeatures { buildConfig true }
}
dependencies {
    implementation project(':android')
    implementation 'com.google.zxing:core:3.5.4'
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
}
