name: Build and publish Maven library
on:
  push:
    branches: ['**']
    tags: ['v[0-9]*']
  pull_request:
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Version in gradle.properties; leave empty to build only'
        required: false
        type: string
      verify_only:
        description: 'Verify an already published release without uploading it again'
        required: false
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: fingerprint-sensor-location-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Validate release request
        if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && inputs.release_version != '')
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            RELEASE_VERSION="${GITHUB_REF_NAME#v}"
            git merge-base --is-ancestor "$GITHUB_SHA" origin/codex/initial-library
          else
            test "$GITHUB_REF" = 'refs/heads/codex/initial-library'
          fi
          VERSION=$(sed -n 's/^libraryVersion=//p' gradle.properties)
          test "$RELEASE_VERSION" = "$VERSION"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: 'false'
      - name: Install compile SDK
        run: sdkmanager 'platforms;android-37.2' 'build-tools;37.0.0'
      - name: Test and build
        run: ./gradlew :core:test :core:jar :android:testDebugUnitTest :android:assembleRelease :android:lintRelease :diagnostic:assembleDebug :diagnostic:assembleDebugAndroidTest :diagnostic:lintDebug :core:publishAllPublicationsToReleaseBundleRepository :android:publishAllPublicationsToReleaseBundleRepository --console=plain
      - name: Build read-only diagnostic
        run: bash tools/build-probe.sh
      - uses: actions/upload-artifact@v7
        with:
          name: fingerprint-location
          path: |
            android/build/outputs/aar/android-release.aar
            build/release-repository/net/xdow/
            core/build/libs/core-*.jar
            .work/probe/fingerprint-location-probe.jar
            diagnostic/build/outputs/apk/debug/diagnostic-debug.apk
            diagnostic/build/outputs/apk/androidTest/debug/diagnostic-debug-androidTest.apk
            core/build/reports/tests/test/
            android/build/reports/tests/testDebugUnitTest/
      - name: Publish to Maven Central
        if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && inputs.release_version != '' && !inputs.verify_only)
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.MAVEN_SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.MAVEN_SIGNING_PASSWORD }}
        run: |
          for NAME in ORG_GRADLE_PROJECT_mavenCentralUsername ORG_GRADLE_PROJECT_mavenCentralPassword ORG_GRADLE_PROJECT_signingInMemoryKey; do
            test -n "${!NAME}" || { echo "::error::Missing $NAME"; exit 1; }
          done
          ./gradlew :core:publishAndReleaseToMavenCentral :android:publishAndReleaseToMavenCentral --no-daemon --console=plain
      - name: Verify public Maven artifacts
        if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && inputs.release_version != '')
        run: |
          VERSION=$(sed -n 's/^libraryVersion=//p' gradle.properties)
          DEST=build/central-verification
          mkdir -p "$DEST"
          for ARTIFACT in fingerprint-location-core fingerprint-location-android; do
            TYPE=jar
            if [[ "$ARTIFACT" == fingerprint-location-android ]]; then TYPE=aar; fi
            BASE="https://repo.maven.apache.org/maven2/net/xdow/$ARTIFACT/$VERSION/$ARTIFACT-$VERSION"
            for SUFFIX in pom "$TYPE" sources.jar javadoc.jar pom.asc "$TYPE.asc" sources.jar.asc javadoc.jar.asc; do
              case "$SUFFIX" in
                sources*|javadoc*) URL="$BASE-$SUFFIX" ;;
                *) URL="$BASE.$SUFFIX" ;;
              esac
              curl --fail --silent --show-error --location --retry 120 --retry-delay 15 --retry-all-errors --output "$DEST/${URL##*/}" "$URL"
            done
          done
          cmp android/build/outputs/aar/android-release.aar "$DEST/fingerprint-location-android-$VERSION.aar"
          cmp "core/build/libs/core-$VERSION.jar" "$DEST/fingerprint-location-core-$VERSION.jar"
